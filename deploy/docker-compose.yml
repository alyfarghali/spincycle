services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "8883:8883" 
    volumes:
      - ../broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - ${BROKER_CERT_DIR:-../broker/certs/dev}/fullchain.pem:/mosquitto/certs/fullchain.pem:ro
      - ${BROKER_CERT_DIR:-../broker/certs/dev}/privkey.pem:/mosquitto/certs/privkey.pem:ro

  postgres:
    image: timescale/timescaledb:2.30.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../storage/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    build:
      context: .. 
      dockerfile: services/ingest/Dockerfile
    restart: unless-stopped
    environment:
      INGEST_BROKER_URL: mqtt://mosquitto:1883
      INGEST_CLIENT_ID: ingest-1
      INGEST_MQTT_USER: ingest
      MQTT_INGEST_PASSWORD: ${MQTT_INGEST_PASSWORD}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  mosquitto-data:
  postgres-data:
