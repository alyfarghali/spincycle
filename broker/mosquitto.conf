# Mosquitto config: TLS listener 8883, WebSockets 443 fallback,
# internal 1883, persistence, queue limits, dynsec plugin.

# Nobody connects without a username and password.
allow_anonymous false

# Log to stdout so `docker compose logs mosquitto` shows it.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ---------------------------------------------------------------------------
# Doors (listeners)
# ---------------------------------------------------------------------------

# Staff door: plain MQTT for our own services (ingest, api) on the Docker
# network. Not published in docker-compose.yml, so unreachable from outside.
listener 1883

# Secure front door: MQTT over TLS for devices and the load generator.
# The only door published to the internet.
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem

# WebSocket door: fallback for networks that block 8883. Internal only; Caddy
# terminates TLS on 443 and forwards wss://<host>/mqtt here.
listener 8080
protocol websockets

# ---------------------------------------------------------------------------
# ID check and permissions (dynamic security plugin)
# ---------------------------------------------------------------------------

# Accounts and roles live in this file inside the data volume, not in git.
# Create it with broker/dynsec/bootstrap.sh; change it with mosquitto_ctrl or
# the API's commands on $CONTROL/dynamic-security/v1.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# ---------------------------------------------------------------------------
# Holding mail (persistence and queues)
# ---------------------------------------------------------------------------

# Keep retained messages and persistent sessions (queued and unacked QoS 1
# messages) across broker restarts.
persistence true
persistence_location /mosquitto/data/

# Persistence is a periodic snapshot, not a log: a broker crash loses whatever
# changed since the last save. 60 s instead of the 30 min default.
autosave_interval 60

# Messages held per disconnected client before new ones are dropped.
# Sized for ingest: 2,000 msg/s x 60 s = 120,000, about 40 MB at ~300 bytes each.
max_queued_messages 120000

# Retained messages, Last Will and shared subscriptions ($share/...) need no
# settings: they are on by default in Mosquitto 2.x.
